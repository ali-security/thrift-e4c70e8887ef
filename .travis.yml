# build Apache Thrift on Travis CI - https://travis-ci.com/

#
# Why this file no longer drives the upstream polyglot Docker matrix
# ------------------------------------------------------------------
# Upstream's Travis matrix runs every leg through `build/docker/run.sh`, which
# first runs `build/docker/refresh.sh` to rebuild the
# `thrift/thrift-build:ubuntu-focal` image from
# `build/docker/ubuntu-focal/Dockerfile`. That image installs the full polyglot
# toolchain (Erlang built from source via kerl, .NET, Haskell, Rust, D, Dart,
# Swift, PHP, Ruby, Perl, Node, Java, Python) -- upstream itself has to wrap it
# in `travis_wait 40` to keep Travis from killing the job for lack of output.
#
# Measured on this fork: all ten thrift-stage legs were still inside
# `refresh.sh` after 14 minutes with no test output, so the build never reaches
# a verdict. Those legs exercise the C++/Java/Python/cross-language
# implementations, none of which is part of the Go module artifact we ship.
#
# The Travis legs below run the project's genuine Go suite instead -- the same
# `lib/go/thrift` package tree that the published module zip contains. Note
# that `./lib/go/...` resolves to exactly `github.com/apache/thrift/lib/go/thrift`:
# `lib/go/test` carries its own `go.mod`, so as a nested module it is excluded
# from the parent module's package pattern.
#

dist: focal
language: minimal

env:
  global:
    - GO_VERSION=1.25.1

jobs:
  include:
    - name: "Go library tests"
      env:
        - JOB="Go library tests"
        - GO_TEST_FLAGS=""
    - name: "Go library tests (race detector)"
      env:
        - JOB="Go library tests (race detector)"
        - GO_TEST_FLAGS="-race"

before_install:
  # storage.googleapis.com/golang/ answers 403 as of 2026; dl.google.com/go/ is the live path.
  - curl -fsSL -o /tmp/go.tar.gz "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz"
  - sudo rm -rf /usr/local/go
  - sudo tar -C /usr/local -xzf /tmp/go.tar.gz
  - export PATH=/usr/local/go/bin:$PATH
  - go version

script:
  - go test -v $GO_TEST_FLAGS ./lib/go/...

